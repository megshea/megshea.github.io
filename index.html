<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Megan Armbrust</title>
  <link rel="stylesheet" href="css/style.css?v=20261102c">
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">MEGAN<br>ARMBRUST</a>
  <nav aria-label="Main navigation">
    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>
<main>
  <section class="reel" id="reel">
    <small>NYC — 2026</small>
    <div class="name">MEGAN<br>ARMBRUST</div>
    <!-- Edit the six homepage floating pieces below. p1–p6 positions live in css/style.css. -->
    <div class="piece p1" role="img" aria-label="photography — Photography">
      <img src="images/photography-card.jpg" alt="Photography">
      <span class="piece-label" aria-hidden="true">Photography</span>
    </div>
    <div class="piece p2" role="img" aria-label="min shaw — Graphic Design">
      <img src="images/MIN SHAW logo v2.png" alt="Min Shaw">
      <span class="piece-label" aria-hidden="true">Graphic Design</span>
    </div>
    <div class="piece p3" role="img" aria-label="sunstainable surfboards — Film">
      <video autoplay muted loop playsinline preload="metadata" poster="images/sunstainable-surfboards.png" aria-label="Sunstainable Surfboards preview"><source src="videos/sunstainable-loop.mp4" type="video/mp4"></video>
      <span class="piece-label" aria-hidden="true">Film</span>
    </div>
    <div class="piece p4" role="img" aria-label="Kiraku — Web Design">
      <img src="images/kiraku mockup.png" alt="Kiraku">
      <span class="piece-label" aria-hidden="true">Web Design</span>
    </div>
    <div class="piece p5" role="img" aria-label="decoverai — Motion Design">
      <video autoplay muted loop playsinline preload="metadata" poster="images/decoverai-thumbnail.png" aria-label="DecoverAI preview"><source src="videos/decoverai-loop.mp4" type="video/mp4"></video>
      <span class="piece-label" aria-hidden="true">Motion Design</span>
    </div>
    <div class="piece p6" role="img" aria-label="Recipe Roulette — Product Design">
      <img src="images/recipe roulette mockup.png" alt="Recipe Roulette">
      <span class="piece-label" aria-hidden="true">Product Design</span>
    </div>
    <a class="scroll" href="#selected">SCROLL TO EXPLORE ↓</a>
  </section>
  <section class="portfolio-progress" aria-labelledby="progress-title">
    <h2 id="progress-title">A little work in progress.</h2>
    <p>My portfolio is currently being updated. In the meantime, feel free to explore or <a href="contact.html">get in touch</a>.</p>
  </section>
  <section id="selected">
    <div class="head">SELECTED WORK</div>
    <div id="grid" class="grid"></div>
  </section></main>
<script src="js/site.js?v=20261102c"></script>
<script src="js/projects.js?v=20261102c"></script>
<script src="js/script.js?v=20261102c"></script>
</body>
</html>
