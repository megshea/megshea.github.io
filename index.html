<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Megan Armbrust</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>

<body>

  <!-- =========================
       HEADER / NAVIGATION
  ========================== -->
  <header class="site-header">
    <a class="logo" href="index.html">
      MEGAN<br>
      ARMBRUST
    </a>

    <nav>
      <a href="work.html">WORK</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </header>

  <main>

    <!-- =========================
         HOMEPAGE VISUAL REEL
    ========================== -->
    <section class="reel" id="reel">

      <small>NYC — 2026</small>

      <div class="name">
        MEGAN<br>
        ARMBRUST
      </div>

      <!-- Floating piece 1 -->
      <a class="piece p1" href="project.html?project=photography" aria-label="Photography — Photography">
        <img src="images/DSC_0332.jpg" alt="Photography">
        <span class="piece-label" aria-hidden="true">Photography</span>
      </a>

      <!-- Floating piece 2 -->
      <a class="piece p2" href="project.html?project=min-shaw" aria-label="Min Shaw — Graphic Design">
        <img src="images/MIN SHAW logo v2.png" alt="Min Shaw">
        <span class="piece-label" aria-hidden="true">Graphic Design</span>
      </a>

      <!-- Floating piece 3 -->
      <a class="piece p3" href="project.html?project=sunstainable-surfboards" aria-label="Sunstainable Surfboards — Film">
        <img src="images/sunstainable-surfboards.png" alt="Sunstainable Surfboards" onerror="this.onerror=null;this.src='images/p3.svg'">
        <span class="piece-label" aria-hidden="true">Film</span>
      </a>

      <!-- Floating piece 4 -->
      <a class="piece p4" href="project.html?project=recipe-roulette" aria-label="Recipe Roulette — Product Design">
        <img src="images/recipe roulette mockup.png" alt="Recipe Roulette">
        <span class="piece-label" aria-hidden="true">Product Design</span>
      </a>

      <!-- Floating piece 5 -->
      <a class="piece p5" href="project.html?project=decoverai" aria-label="DecoverAI Product Animations — Motion Design">
        <video autoplay muted loop playsinline preload="none" poster="images/decoverai-thumbnail.jpg" aria-label="DecoverAI motion design preview">
          <source src="videos/decoverai-loop.mp4" type="video/mp4">
        </video>
        <span class="piece-label" aria-hidden="true">Motion Design</span>
      </a>

      <!-- Floating piece 6 -->
      <a class="piece p6" href="project.html?project=kiraku" aria-label="Kiraku — Brand Design">
        <img src="images/kiraku mockup.png" alt="Kiraku">
        <span class="piece-label" aria-hidden="true">Brand Design</span>
      </a>

      <a class="scroll" href="#selected">
        SCROLL TO EXPLORE ↓
      </a>

    </section>

    <!-- =========================
         SELECTED WORK
    ========================== -->
    <section id="selected">
      <div class="head">SELECTED WORK</div>
      <div id="grid" class="grid"></div>
    </section>

  </main>

  <script src="js/projects.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
